# go2rtc Media Gateway Configuration for Intel N100 (VA-API /dev/dri)
log:
  level: info

api:
  listen: "127.0.0.1:1984" # Bound strictly to localhost for security

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"
  candidates:
    - 192.168.1.100:8555
    - stun:stun.l.google.com:19302

# One entry per store camera, keyed by the camera id used in the dashboard
# (GET /api/v1/cameras). Example:
#   cam_aisle_3:
#     - rtsp://<user>:<password>@<camera-ip>:554/cam/realmonitor?channel=3&subtype=0
#     - "ffmpeg:cam_aisle_3#video=h264#hardware=vaapi"
streams: {}
