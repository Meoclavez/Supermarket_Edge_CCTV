# CPU / Intel / Hailo hosts:  docker compose up -d
# NVIDIA hosts (needs nvidia-container-toolkit on the host):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Live video: no TURN relay and no separate go2rtc container. go2rtc runs
# inside edge_api as a child of the app, started on the first live-video
# session and stopped with the app (services/go2rtc_manager.py; binary from
# scripts/bootstrap.py, or GO2RTC_PATH). Remote viewers get direct
# peer-to-peer WebRTC only (docs/REMOTE_VIDEO_CONTRACT.md).
# See docs/DEPLOYMENT.md "Remote access".

services:
  # 1. Edge AI Core API, analysis pipeline and the in-app go2rtc (live video)
  edge_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cctv_edge_api
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    # Only devices every x86 host has. A missing device path makes compose
    # refuse to start, so optional accelerators go in override files:
    #   NVIDIA -> docker-compose.gpu.yml
    #   Hailo  -> add `devices: ["/dev/hailo0:/dev/hailo0"]` in a
    #             docker-compose.override.yml on machines that have one.
    devices:
      - /dev/dri:/dev/dri       # Intel QuickSync / VA-API for fast frame grabber
    volumes:
      # SQLite DB + clips + snapshots + DVR. The image mirrors the repo layout,
      # so the storage root is /opt/edge-cctv/storage (see Dockerfile).
      - ./storage:/opt/edge-cctv/storage
      # Models are verified against models/manifest.json by the preflight;
      # mounting them lets you update models without rebuilding the image.
      - ./models:/opt/edge-cctv/edge_backend/models:ro
      - ./certs:/opt/edge-cctv/edge_backend/certs
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # go2rtc's API (in-app child, 127.0.0.1 only); its binary must be in the
      # image or mounted, e.g. GO2RTC_PATH=/opt/edge-cctv/bin/go2rtc.
      - GO2RTC_API_PORT=1984
      # Empty means "use the per-machine store": the app generates these on
      # first start in ./storage/secrets/device_secrets.json (mode 0600).
      - JWT_SECRET=${JWT_SECRET:-}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-}
      - NVR_CREDENTIAL_KEY=${NVR_CREDENTIAL_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. Caddy Reverse Proxy (TLS Termination for HTTPS/WSS)
  caddy:
    image: caddy:2-alpine
    container_name: cctv_caddy_gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    depends_on:
      - edge_api

  # 3. Tailscale Zero-Trust VPN Gateway (Optional Subnet Router)
  tailscale:
    image: tailscale/tailscale:latest
    container_name: cctv_tailscale
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./tailscale_state:/var/lib/tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_ROUTES=192.168.1.0/24
      - TS_EXTRA_ARGS=--advertise-tags=tag:cctv-edge
      - TS_STATE_DIR=/var/lib/tailscale
