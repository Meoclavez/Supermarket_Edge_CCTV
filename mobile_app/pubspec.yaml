name: edge_ai_cctv
description: "Supermarket Edge CCTV staff app: loss-prevention alerts, live view and store analytics."
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^17.0.0
  video_player: ^2.8.2
  http: ^1.2.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.0.3
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.0.0
  mobile_scanner: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
