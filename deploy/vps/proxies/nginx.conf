# nginx: the tunnel host and every store dashboard (<store>-cctv.example.com).
# Put in the http{} context (e.g. conf.d/edge-cctv.conf); replace example.com and
# the certificate paths. Upstream: nginx in Docker on the same network ->
# edge-frps:7000 / :8080; nginx on the host -> publish frps on loopback
# (README.md) and use 127.0.0.1:7000 / :8080.

# Once per nginx (skip if your config already defines it).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=edgecctv:10m rate=30r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name tunnel.example.com;
    ssl_certificate     /etc/letsencrypt/live/tunnel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.example.com/privkey.pem;

    # frp's WebSocket path only; everything else on this host is 404.
    location = /~!frp {
        proxy_pass http://edge-frps:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ~^[a-z0-9-]+-cctv\.example\.com$;
    # A certificate covering *.example.com (wildcard via DNS challenge, or your
    # CDN's origin certificate if one sits in front).
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    client_max_body_size 50m;

    location / {
        limit_req zone=edgecctv burst=120 nodelay;
        proxy_pass http://edge-frps:8080;
        proxy_http_version 1.1;
        # Host must be the store's name: frps routes by it.
        proxy_set_header Host $host;
        # Appends the visitor's address; the edge box reads it from this position.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Live camera view is a long-running stream: no buffering, long timeout.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
    }
}
